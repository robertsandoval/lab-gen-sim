# Example LLM credentials for build-time codegen tasks.
# DO NOT commit real tokens. Copy and apply in your namespace:
#
#   oc create secret generic llm-codegen-credentials \
#     --from-literal=api-key="$MAAS_API_TOKEN" \
#     --from-literal=base-url="https://maas-rhdp.apps.maas.redhatworkshops.io/v1" \
#     --from-literal=model="llama-scout-17b"
#
# Or for OpenAI:
#   --from-literal=api-key="$OPENAI_API_KEY" \
#   --from-literal=base-url="https://api.openai.com/v1" \
#   --from-literal=model="gpt-4o-mini"
apiVersion: v1
kind: Secret
metadata:
  name: llm-codegen-credentials
  labels:
    app.kubernetes.io/part-of: lab-gen-sim
type: Opaque
stringData:
  api-key: "REPLACE_ME"
  base-url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
