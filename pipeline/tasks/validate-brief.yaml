apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-brief
  labels:
    app.kubernetes.io/part-of: lab-gen-sim
spec:
  description: Validate domain-brief.yaml against JSON Schema
  params:
    - name: brief-path
      type: string
      default: domain-brief.yaml
  workspaces:
    - name: source
  steps:
    - name: validate
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet pyyaml jsonschema
        python /scripts/validate-brief.py "$(params.brief-path)"
      volumeMounts:
        - name: lab-scripts
          mountPath: /scripts
  volumes:
    - name: lab-scripts
      configMap:
        name: lab-gen-sim-scripts
        defaultMode: 0555
